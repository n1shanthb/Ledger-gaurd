specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: GuardianPolicyManager
    network: base
    source:
      address: "0xdBf463E260573797Dd1a03B4f45876aad777453b"
      abi: GuardianPolicyManager
      startBlock: 50944222
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Policy
        - ExecutionReceipt
        - KillSwitch
      abis:
        - name: GuardianPolicyManager
          file: ./abis/GuardianPolicyManager.json
      eventHandlers:
        - event: PolicyCreated(indexed bytes32,indexed address,indexed address,uint8,uint256,uint256,uint256,uint256)
          handler: handlePolicyCreated
        - event: PolicyRevoked(indexed bytes32,indexed address)
          handler: handlePolicyRevoked
        - event: ExecutionReceipt(indexed bytes32,indexed address,indexed bytes32,uint8,uint256,uint256,uint256,uint256,bool)
          handler: handleExecutionReceipt
        - event: KillSwitchActivated(indexed address,uint256,uint256)
          handler: handleKillSwitchActivated
      file: ./src/mapping.ts
  - kind: ethereum
    name: PaymentAuditLog
    network: base
    source:
      address: "0x689ae72edebbf31c59e79b3cd0926a7bd638f495"
      abi: PaymentAuditLog
      startBlock: 51045462
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PaymentAudit
        - Policy
      abis:
        - name: PaymentAuditLog
          file: ./abis/PaymentAuditLog.json
      eventHandlers:
        - event: PaymentAudit(indexed bytes32,indexed bytes32,bytes32,string,string,uint256)
          handler: handlePaymentAudit
      file: ./src/mapping.ts
